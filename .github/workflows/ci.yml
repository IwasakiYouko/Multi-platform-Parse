name: CI and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Race tests, vet, compile, and Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      YTDLP_PYTHON: /opt/yt-dlp/bin/python
      YTDLP_JS_RUNTIME: /usr/local/bin/deno
      DENO_NO_UPDATE_CHECK: '1'
      DENO_NO_PROMPT: '1'
    steps:
      # Official action refs resolved through the GitHub git/ref API; keep SHA pins when updating.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: true
      - name: Install pinned extractor and media runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg python3-venv python3-pip
          sudo /usr/bin/python3 scripts/install_ytdlp_runtime.py
      - name: Smoke installed extractor without platform requests
        run: "$YTDLP_PYTHON -I scripts/check_ytdlp_runtime.py"
      - name: Check dependency license collection
        run: |
          go mod download all
          go run ./scripts/licenses -out "$RUNNER_TEMP/dependency-licenses"
      - name: Test runtime and source bundling scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Race tests
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Compile
        run: go build -trimpath -o "$RUNNER_TEMP/multiparse" ./cmd/multiparse
      - name: Validate deployment and source build override
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.build.yaml config --quiet
      - name: Check packaged extractor on Alpine as non-root
        run: |
          docker build --platform linux/amd64 --target app --tag multiparse-runtime-check .
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --env DENO_DIR=/tmp/deno-smoke \
            --mount "type=bind,src=$PWD/scripts/check_ytdlp_runtime.py,dst=/runtime-smoke.py,readonly" \
            --entrypoint /opt/yt-dlp/bin/python multiparse-runtime-check -I /runtime-smoke.py

  images:
    name: Build and publish linux/amd64 image
    needs: checks
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select immutable and release tags
        id: tags
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Release tags must be vMAJOR.MINOR.PATCH' >&2; exit 1; }
          version="${REF_NAME#v}"
          printf 'sha-%s\n%s\nlatest\n' "$GITHUB_SHA" "$version" > "$RUNNER_TEMP/image-tags"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build Alpine application image
        run: |
          set -euo pipefail
          image=ghcr.io/iwasakiyouko/multi-platform-parse
          tags=()
          while IFS= read -r tag; do tags+=(--tag "$image:$tag"); done < "$RUNNER_TEMP/image-tags"
          docker build --platform linux/amd64 --target app --build-arg "VCS_REF=$GITHUB_SHA" "${tags[@]}" .
      - name: Bundle exact Alpine copyleft corresponding sources
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          container=$(docker create "ghcr.io/iwasakiyouko/multi-platform-parse:$VERSION")
          trap 'docker rm -f "$container" > /dev/null' EXIT
          docker cp "$container:/usr/local/share/doc/multiparse/alpine-packages.txt" release/alpine-packages.txt
          docker cp "$container:/usr/local/share/doc/multiparse/alpine-packages.tsv" release/alpine-packages.tsv
          docker rm "$container"
          trap - EXIT
          python3 scripts/alpine_sources.py --inventory release/alpine-packages.tsv --output release --release "v$VERSION"
      - name: Push application image
        run: |
          set -euo pipefail
          image=ghcr.io/iwasakiyouko/multi-platform-parse
          while IFS= read -r tag; do docker push "$image:$tag"; done < "$RUNNER_TEMP/image-tags"
      - name: Prepare Docker-loadable public release assets
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          archive="multi-platform-parse-v${VERSION}-linux-amd64.tar.gz"
          docker save "ghcr.io/iwasakiyouko/multi-platform-parse:$VERSION" | gzip -1 > "release/$archive"
          cp compose.yaml .env.example release/
          # Match the downloaded Compose defaults to this release, without a YAML dependency.
          VERSION="$VERSION" python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          version = os.environ['VERSION']
          path = Path('release/compose.yaml')
          path.write_text(re.sub(r'\$\{IMAGE_TAG:-[^}]+\}', '${IMAGE_TAG:-' + version + '}', path.read_text()))
          path = Path('release/.env.example')
          path.write_text(re.sub(r'^IMAGE_TAG=.*$', 'IMAGE_TAG=' + version, path.read_text(), flags=re.MULTILINE))
          PY
          (cd release && sha256sum "$archive" compose.yaml .env.example alpine-packages.txt > SHA256SUMS)
          (cd release && sha256sum alpine-packages.tsv alpine-source-manifest.json multi-platform-parse-v*-alpine-gpl-sources.tar.gz* > ALPINE-SOURCES-SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type == 'tag'
        with:
          name: public-release
          path: release/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Clear registry credentials
        if: always()
        run: docker logout ghcr.io

  release:
    name: Publish public GitHub Release
    needs: images
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: public-release
          path: release
      - name: Publish release and deployment assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mv release/.env.example release/default.env.example
          printf 'Load image with: `docker load -i multi-platform-parse-%s-linux-amd64.tar.gz`.\n\n' "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes"
          cat >> "$RUNNER_TEMP/release-notes" <<'NOTES'
          Single-container Linux amd64 Alpine image (`alpine:3.24`) for Multi-platform-Parse. YouTube, Facebook, and Snapchat use the bundled, pinned yt-dlp/EJS/Deno runtime; all other platforms use native Go adapters.

          Highlights in v2.2.0:
          - Full 24-platform zero-tracking canonical URL purification: Xiaohongshu outputs 100% parameter-free `https://www.xiaohongshu.com/explore/{id}` by default (with an optional Admin toggle to attach `xsec_token` only while still stripping `xsec_source`), Xiaoheihe API share wrappers (`api.xiaoheihe.cn/.../share?link_id=...`) unwrap to `https://www.xiaoheihe.cn/app/bbs/link/{id}`, plus canonical normalization across Weixin Channels, Zhihu (`zhihu.link` / `/appview/p/`), Tieba, Weibo, Douban, Coolapk, Toutiao, TikTok, YouTube (`youtu.be`), and inline URLs inside `{content}`.
          - Upgraded default video passthrough ceiling from `720p` to `1080p` (`-c:v copy` zero-reencode passthrough for compliant 1080p H.264 streams), pure-Go WebP decoding (`golang.org/x/image/webp`) preserving long screenshots up to `16384px / 50MP` without FFmpeg lock contention, Pipix unwatermarked `origin_video_download` priority, Bilibili PCDN deprioritization + `AudioBackupURLs` fallback, and smart keyframe seeking on fallback thumbnails.
          - Product & template upgrades: 0-image / single-image long-form articles exceeding `SummaryLength` automatically emit Message 2 Full-Text Merged Forward Reader (`<= 1500` runes/node), new `{duration}` / `{raw_duration}` variables, expanded native `{tags}` & `{author}` extraction, Bilibili Opus & Weibo `livephoto` pairing, and invisible zero-width character sanitization.
          - Refreshed Admin Console (`v2.2.0`): Sandbox Before -> After URL Purification Diff Inspector, QQ NT high-fidelity chat & expandable Merged Forward node simulator, 24-platform brand badges, tri-color cache quota bar, and one-click task/cache Sandbox replay.

          Offline / archive installation: download the `.tar.gz` image archive, `SHA256SUMS`, `compose.yaml`, `alpine-packages.txt`, and `default.env.example` from this Release. Save `default.env.example` locally as `.env.example`, verify with `sha256sum -c SHA256SUMS`, load the image archive with the command above, copy `.env.example` to `.env`, create `certs/`, and run `docker compose up -d --no-build`.

          Alpine copyleft corresponding sources: every GPL/LGPL/AGPL package installed in the image (including `ffmpeg`, `busybox`, `gcc` runtime libraries, `x264`, `x265`, etc.) is recorded with its exact Alpine `aports` commit in `alpine-packages.tsv` and bundled with SHA-512-verified `APKBUILD`, local patches, and upstream source tarballs in `multi-platform-parse-*-alpine-gpl-sources.tar.gz*` alongside `alpine-source-manifest.json` and `ALPINE-SOURCES-SHA256SUMS` (`sha256sum -c ALPINE-SOURCES-SHA256SUMS`).
          NOTES
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes"
          fi
