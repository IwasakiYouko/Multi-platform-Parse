name: multiparse

services:
  app:
    image: ghcr.io/iwasakiyouko/multi-platform-parse:${IMAGE_TAG:-1.1.0}
    network_mode: host
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    environment:
      DATA_DIR: /data
      CACHE_DIR: /media
      CAP_ADMIN_KEY_FILE: /secrets/cap-admin.key
      LISTEN_ADDR: ${LISTEN_ADDR:-::}
      START_PORT: ${START_PORT:-10492}
      EXTERNAL_URL: ${EXTERNAL_URL:-}
      CAP_ENABLED: ${CAP_ENABLED:-true}
      CAP_URL: http://127.0.0.1:${CAP_PORT:-30192}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - app-data:/data
      - media:/media
      - secrets:/secrets
      - ./certs:/certs:ro
    tmpfs:
      - /tmp:size=268435456,mode=1777
    depends_on:
      valkey:
        condition: service_healthy
      cap:
        condition: service_started
    healthcheck:
      test: ["CMD", "/usr/local/bin/multiparse", "health", "--data", "/data"]
      interval: 30s
      timeout: 8s
      start_period: 90s
      retries: 3
    stop_grace_period: 45s

  cap:
    image: ghcr.io/iwasakiyouko/multi-platform-parse-cap:${IMAGE_TAG:-1.1.0}
    network_mode: host
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    environment:
      CAP_ADMIN_KEY_FILE: /secrets/cap-admin.key
      SERVER_HOSTNAME: 127.0.0.1
      SERVER_PORT: ${CAP_PORT:-30192}
      REDIS_URL: redis://127.0.0.1:${VALKEY_PORT:-30292}
      ENABLE_ASSETS_SERVER: "false"
    volumes:
      - secrets:/secrets:ro
    tmpfs:
      - /tmp:size=134217728,mode=1777
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:'+process.env.SERVER_PORT+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      start_period: 90s
      retries: 3
    stop_grace_period: 15s

  valkey:
    image: valkey/valkey:8.1.3-alpine@sha256:d827e7f7552cdee40cc7482dbae9da020f42bc47669af6f71182a4ef76a22773
    network_mode: host
    restart: unless-stopped
    command: ["valkey-server", "--bind", "127.0.0.1", "--port", "${VALKEY_PORT:-30292}", "--protected-mode", "yes", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - cap-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-p", "${VALKEY_PORT:-30292}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    stop_grace_period: 15s

volumes:
  app-data:
  media:
  secrets:
  cap-data:
